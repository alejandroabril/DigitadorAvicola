android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.injected.testOnly=false
android.defaults.buildfeatures.resvalues=true

# Forzamos KSP2 para evitar errores de sincronizacion
ksp.useKsp2=true

# ── Rendimiento de build ──────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Si algun plugin se queja del configuration-cache, comentar la siguiente linea.
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
